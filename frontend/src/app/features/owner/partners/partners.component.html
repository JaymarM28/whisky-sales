<div class="page-container">
  <div class="page-header">
    <h1>
      <mat-icon>people</mat-icon>
      Socios
    </h1>
    <button mat-raised-button color="primary" (click)="abrirFormulario()">
      <mat-icon>add</mat-icon>
      Nuevo socio
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <div *ngIf="cargando" class="loading-container">
        <mat-spinner diameter="36"></mat-spinner>
      </div>

      <div *ngIf="!cargando" class="table-container">
        <table mat-table [dataSource]="socios">
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let row">{{ row.name }}</td>
          </ng-container>

          <ng-container matColumnDef="comision">
            <th mat-header-cell *matHeaderCellDef>Comisión %</th>
            <td mat-cell *matCellDef="let row">{{ row.commissionPct }}%</td>
          </ng-container>

          <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let row">
              <mat-chip [class.chip-confirmada]="row.active" [class.chip-rechazada]="!row.active">
                {{ row.active ? 'Activo' : 'Inactivo' }}
              </mat-chip>
            </td>
          </ng-container>

          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="primary" (click)="abrirFormulario(row)" matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button
                *ngIf="row.active"
                mat-icon-button
                color="warn"
                (click)="confirmarDesactivar(row)"
                matTooltip="Desactivar"
              >
                <mat-icon>person_off</mat-icon>
              </button>
              <button
                *ngIf="!row.active"
                mat-icon-button
                color="primary"
                (click)="confirmarActivar(row)"
                matTooltip="Activar"
              >
                <mat-icon>person</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columnas"></tr>
          <tr mat-row *matRowDef="let row; columns: columnas"></tr>
        </table>

        <p *ngIf="socios.length === 0" class="empty-state">No hay socios registrados</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
