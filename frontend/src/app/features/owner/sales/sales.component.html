<div class="page-container">
  <div class="page-header">
    <h1><mat-icon>point_of_sale</mat-icon> Ventas</h1>
    <button mat-icon-button (click)="cargarVentas()" matTooltip="Actualizar">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <app-skeleton-table *ngIf="cargando" [rows]="6" [columns]="7"></app-skeleton-table>

      <div *ngIf="!cargando" class="table-container">
        <table mat-table [dataSource]="ventas">
          <ng-container matColumnDef="fecha">
            <th mat-header-cell *matHeaderCellDef>Fecha</th>
            <td mat-cell *matCellDef="let row">{{ row.date | date:'dd/MM/yyyy' }}</td>
          </ng-container>

          <ng-container matColumnDef="socio">
            <th mat-header-cell *matHeaderCellDef>Socio</th>
            <td mat-cell *matCellDef="let row">{{ row.partner?.name }}</td>
          </ng-container>

          <ng-container matColumnDef="producto">
            <th mat-header-cell *matHeaderCellDef>Producto</th>
            <td mat-cell *matCellDef="let row">{{ row.product?.name }}</td>
          </ng-container>

          <ng-container matColumnDef="cantidad">
            <th mat-header-cell *matHeaderCellDef>Cantidad</th>
            <td mat-cell *matCellDef="let row">{{ row.quantity }}</td>
          </ng-container>

          <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let row">
              <mat-chip [class]="getChipClass(row.status)">
                {{ getLabelEstado(row.status) }}
              </mat-chip>
            </td>
          </ng-container>

          <ng-container matColumnDef="comprobante">
            <th mat-header-cell *matHeaderCellDef>Comprobante</th>
            <td mat-cell *matCellDef="let row">
              <button
                mat-icon-button
                [disabled]="!row.receiptImage"
                (click)="verComprobante(row)"
                matTooltip="Ver comprobante"
              >
                <mat-icon>receipt_long</mat-icon>
              </button>
            </td>
          </ng-container>

          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let row">
              <button
                mat-icon-button
                color="primary"
                [disabled]="row.status !== 'PENDING'"
                (click)="cambiarEstado(row, 'CONFIRMED')"
                matTooltip="Confirmar"
              >
                <mat-icon>check_circle</mat-icon>
              </button>
              <button
                mat-icon-button
                color="warn"
                [disabled]="row.status !== 'PENDING'"
                (click)="cambiarEstado(row, 'REJECTED')"
                matTooltip="Rechazar"
              >
                <mat-icon>cancel</mat-icon>
              </button>
              <button
                mat-icon-button
                color="warn"
                (click)="confirmarEliminar(row)"
                matTooltip="Eliminar"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columnas"></tr>
          <tr mat-row *matRowDef="let row; columns: columnas"></tr>
        </table>

        <mat-paginator
          *ngIf="totalItems > pageSize"
          [length]="totalItems"
          [pageSize]="pageSize"
          [pageSizeOptions]="[10, 20, 50]"
          [pageIndex]="currentPage - 1"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>

        <p *ngIf="ventas.length === 0 && !cargando" class="empty-state">No hay ventas registradas</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
