<div class="page-container">
  <div class="page-header">
    <h1><mat-icon>swap_horiz</mat-icon> Traspasos</h1>
    <button mat-raised-button color="primary" (click)="abrirFormulario()">
      <mat-icon>add</mat-icon>
      Registrar traspaso
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <app-skeleton-table *ngIf="cargando" [rows]="5" [columns]="7"></app-skeleton-table>

      <div *ngIf="!cargando" class="table-container">
        <table mat-table [dataSource]="traspasos">
          <ng-container matColumnDef="fecha">
            <th mat-header-cell *matHeaderCellDef>Fecha</th>
            <td mat-cell *matCellDef="let row">{{ row.date | date:'dd/MM/yyyy':'UTC' }}</td>
          </ng-container>

          <ng-container matColumnDef="de">
            <th mat-header-cell *matHeaderCellDef>De</th>
            <td mat-cell *matCellDef="let row">{{ row.fromPartner?.name }}</td>
          </ng-container>

          <ng-container matColumnDef="a">
            <th mat-header-cell *matHeaderCellDef>A</th>
            <td mat-cell *matCellDef="let row">{{ row.toPartner?.name }}</td>
          </ng-container>

          <ng-container matColumnDef="producto">
            <th mat-header-cell *matHeaderCellDef>Producto</th>
            <td mat-cell *matCellDef="let row">{{ row.product?.name }}</td>
          </ng-container>

          <ng-container matColumnDef="cantidad">
            <th mat-header-cell *matHeaderCellDef>Cantidad</th>
            <td mat-cell *matCellDef="let row"><strong>{{ row.quantity }}</strong></td>
          </ng-container>

          <ng-container matColumnDef="notas">
            <th mat-header-cell *matHeaderCellDef>Notas</th>
            <td mat-cell *matCellDef="let row">{{ row.notes || '-' }}</td>
          </ng-container>

          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="warn" (click)="confirmarEliminar(row)" matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columnas"></tr>
          <tr mat-row *matRowDef="let row; columns: columnas"></tr>
        </table>

        <mat-paginator
          *ngIf="totalItems > pageSize"
          [length]="totalItems"
          [pageSize]="pageSize"
          [pageSizeOptions]="[10, 20, 50]"
          [pageIndex]="currentPage - 1"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>

        <p *ngIf="traspasos.length === 0" class="empty-state">No hay traspasos registrados</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
