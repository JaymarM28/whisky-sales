<h2 mat-dialog-title>
  <mat-icon>local_shipping</mat-icon>
  Registrar entrega
</h2>

<mat-dialog-content class="dialog-content">
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Socio</mat-label>
      <mat-select formControlName="partnerId">
        <mat-option *ngFor="let socio of data.socios" [value]="socio.id">
          {{ socio.name }}
        </mat-option>
      </mat-select>
      <mat-error>Selecciona un socio</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Producto</mat-label>
      <mat-select formControlName="productId">
        <mat-option *ngFor="let p of data.productos" [value]="p.id">
          {{ p.name }}
        </mat-option>
      </mat-select>
      <mat-error>Selecciona un producto</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Cantidad</mat-label>
      <input matInput type="number" formControlName="quantity" min="1" />
      <mat-error>La cantidad debe ser mayor a 0</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Fecha</mat-label>
      <input matInput type="date" formControlName="date" />
      <mat-error>La fecha es obligatoria</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Notas (opcional)</mat-label>
      <textarea matInput formControlName="notes" rows="2"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()" [disabled]="form.invalid || guardando">
    {{ guardando ? 'Guardando...' : 'Registrar' }}
  </button>
</mat-dialog-actions>
