<div class="page-container">
  <div class="page-header">
    <h1><mat-icon>settings</mat-icon> Configuración</h1>
  </div>

  <mat-card class="settings-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon>lock</mat-icon>
        Cambiar PIN
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" class="settings-form">
        <mat-form-field appearance="outline">
          <mat-label>Nuevo PIN</mat-label>
          <input
            matInput
            formControlName="pin"
            [type]="ocultarPin ? 'password' : 'text'"
            inputmode="numeric"
            maxlength="6"
          />
          <button mat-icon-button matSuffix type="button" (click)="ocultarPin = !ocultarPin">
            <mat-icon>{{ ocultarPin ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('pin')?.hasError('required')">El PIN es obligatorio</mat-error>
          <mat-error *ngIf="form.get('pin')?.hasError('minlength')">Mínimo 4 dígitos</mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          (click)="guardar()"
          [disabled]="form.invalid || guardando"
        >
          <mat-icon>save</mat-icon>
          {{ guardando ? 'Guardando...' : 'Guardar PIN' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
