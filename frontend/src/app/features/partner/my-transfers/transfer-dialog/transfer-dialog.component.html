<h2 mat-dialog-title>
  <mat-icon>swap_horiz</mat-icon>
  Nuevo traspaso
</h2>

<mat-dialog-content class="dialog-content">
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Destinatario</mat-label>
      <mat-select formControlName="toPartnerId">
        <mat-option *ngFor="let s of data.socios" [value]="s.id">{{ s.name }}</mat-option>
      </mat-select>
      <mat-error>Selecciona un destinatario</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Producto</mat-label>
      <mat-select formControlName="productId">
        <mat-option *ngFor="let item of data.inventario" [value]="item.product.id">
          {{ item.product.name }} ({{ item.available }} disponibles)
        </mat-option>
      </mat-select>
      <mat-error>Selecciona un producto</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Cantidad</mat-label>
      <input matInput type="number" formControlName="quantity" min="1" [max]="disponible" />
      <mat-hint *ngIf="form.value.productId">Máximo disponible: {{ disponible }}</mat-hint>
      <mat-error *ngIf="form.get('quantity')?.hasError('min')">La cantidad debe ser mayor a 0</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Fecha</mat-label>
      <input matInput type="date" formControlName="date" />
      <mat-error>La fecha es obligatoria</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Notas (opcional)</mat-label>
      <textarea matInput formControlName="notes" rows="2"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button
    mat-raised-button
    color="primary"
    (click)="guardar()"
    [disabled]="form.invalid || guardando"
  >
    {{ guardando ? 'Guardando...' : 'Traspasar' }}
  </button>
</mat-dialog-actions>
