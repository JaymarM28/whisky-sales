<div class="page-container">
  <div class="page-header">
    <h1><mat-icon>point_of_sale</mat-icon> Mis Ventas</h1>
    <button mat-raised-button color="primary" (click)="reportarVenta()">
      <mat-icon>add</mat-icon>
      Reportar venta
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <app-skeleton-table *ngIf="cargando" [rows]="6" [columns]="6"></app-skeleton-table>

      <div *ngIf="!cargando" class="table-container">
        <table mat-table [dataSource]="ventas">
          <ng-container matColumnDef="fecha">
            <th mat-header-cell *matHeaderCellDef>Fecha</th>
            <td mat-cell *matCellDef="let row">{{ row.date | date:'dd/MM/yyyy' }}</td>
          </ng-container>

          <ng-container matColumnDef="producto">
            <th mat-header-cell *matHeaderCellDef>Producto</th>
            <td mat-cell *matCellDef="let row">{{ row.product?.name }}</td>
          </ng-container>

          <ng-container matColumnDef="cantidad">
            <th mat-header-cell *matHeaderCellDef>Cantidad</th>
            <td mat-cell *matCellDef="let row">{{ row.quantity }}</td>
          </ng-container>

          <ng-container matColumnDef="cliente">
            <th mat-header-cell *matHeaderCellDef>Cliente</th>
            <td mat-cell *matCellDef="let row">
              <mat-chip [class]="row.clientType === 'BUSINESS' ? 'chip-negocio' : 'chip-consumidor'">
                {{ row.clientType === 'BUSINESS' ? 'Negocio' : 'Consumidor' }}
              </mat-chip>
            </td>
          </ng-container>

          <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let row">
              <mat-chip [class]="getChipClass(row.status)">
                {{ getLabelEstado(row.status) }}
              </mat-chip>
            </td>
          </ng-container>

          <ng-container matColumnDef="notas">
            <th mat-header-cell *matHeaderCellDef>Notas</th>
            <td mat-cell *matCellDef="let row">{{ row.notes || '-' }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columnas"></tr>
          <tr mat-row *matRowDef="let row; columns: columnas"></tr>
        </table>

        <mat-paginator
          *ngIf="totalItems > pageSize"
          [length]="totalItems"
          [pageSize]="pageSize"
          [pageSizeOptions]="[10, 20, 50]"
          [pageIndex]="currentPage - 1"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>

        <p *ngIf="ventas.length === 0 && !cargando" class="empty-state">No has reportado ventas aún</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
