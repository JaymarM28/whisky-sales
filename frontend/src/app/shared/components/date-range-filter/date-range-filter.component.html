<div class="rango">
  <mat-form-field appearance="outline" class="fecha">
    <mat-label>Desde</mat-label>
    <input matInput type="date" [(ngModel)]="desde" (change)="aplicar()" [max]="hasta" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="fecha">
    <mat-label>Hasta</mat-label>
    <input matInput type="date" [(ngModel)]="hasta" (change)="aplicar()" [min]="desde" />
  </mat-form-field>

  <div class="atajos">
    <button mat-stroked-button type="button" (click)="esteMes()">Este mes</button>
    <button mat-stroked-button type="button" (click)="mesPasado()">Mes pasado</button>
    <button mat-button type="button" (click)="limpiar()" *ngIf="desde || hasta">
      <mat-icon>clear</mat-icon> Todas las fechas
    </button>
  </div>
</div>
