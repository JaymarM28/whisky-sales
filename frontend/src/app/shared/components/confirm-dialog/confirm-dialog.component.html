<h2 mat-dialog-title>{{ data.titulo }}</h2>
<mat-dialog-content>
  <p style="white-space: pre-line">{{ data.mensaje }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button [color]="data.confirmarColor || 'warn'" (click)="confirmar()">
    {{ data.confirmarLabel || 'Eliminar' }}
  </button>
</mat-dialog-actions>
